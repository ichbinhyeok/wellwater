services:
  app:
    image: shinhyeok22/waterverdict:latest
    container_name: waterverdict
    restart: unless-stopped
    ports:
      - "8809:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      APP_SITE_BASE_URL: ${APP_SITE_BASE_URL:-https://waterverdict.com}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_TAP_SCORE_ESSENTIAL_URL: ${APP_TAP_SCORE_ESSENTIAL_URL:-}
      APP_TAP_SCORE_ADVANCED_URL: ${APP_TAP_SCORE_ADVANCED_URL:-}
      NJ_PARTNER_CSV_PATH: ${NJ_PARTNER_CSV_PATH:-}
      NJ_GEOCODER_ENABLED: ${NJ_GEOCODER_ENABLED:-true}
      APP_OPENAI_DOMAIN_CHALLENGE_TOKEN: ${APP_OPENAI_DOMAIN_CHALLENGE_TOKEN:-}
      APP_SUPPORT_EMAIL: ${APP_SUPPORT_EMAIL:-support@waterverdict.com}
    volumes:
      - ./data:/app/data
    mem_limit: 512m
