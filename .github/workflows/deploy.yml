name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-waterverdict
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_NAME: waterverdict
  DOMAIN: waterverdict.com
  DEPLOY_PATH: ~/deploy/waterverdict
  DOCKERHUB_IMAGE: shinhyeok22/waterverdict
  HOST_PORT: "8809"
  CONTAINER_PORT: "8080"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Normalize OCI SSH target
        shell: bash
        run: |
          RAW_HOST='${{ secrets.OCI_HOST }}'
          RAW_HOST="${RAW_HOST//$'\r'/}"
          RAW_HOST="${RAW_HOST//$'\n'/}"
          RAW_HOST="$(echo "${RAW_HOST}" | xargs)"
          RAW_HOST="${RAW_HOST#http://}"
          RAW_HOST="${RAW_HOST#https://}"
          RAW_HOST="${RAW_HOST%%/*}"

          OCI_HOST_CLEAN="${RAW_HOST}"
          OCI_PORT="22"

          if [[ "${OCI_HOST_CLEAN}" == *:* && "${OCI_HOST_CLEAN}" != \[*\] ]]; then
            OCI_PORT="${OCI_HOST_CLEAN##*:}"
            OCI_HOST_CLEAN="${OCI_HOST_CLEAN%:*}"
          fi

          if [[ -z "${OCI_HOST_CLEAN}" ]]; then
            echo "OCI_HOST secret is empty or invalid after normalization."
            exit 1
          fi

          echo "OCI_HOST_CLEAN=${OCI_HOST_CLEAN}" >> "${GITHUB_ENV}"
          echo "OCI_PORT=${OCI_PORT}" >> "${GITHUB_ENV}"

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/oci_key <<'KEY'
          ${{ secrets.OCI_KEY }}
          KEY
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -p "${OCI_PORT}" -H "${OCI_HOST_CLEAN}" >> ~/.ssh/known_hosts

      - name: Sync content data to OCI
        shell: bash
        env:
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
        run: |
          tar -czf /tmp/waterverdict-seed-data.tgz data/pseo data/registry
          scp -P "${OCI_PORT}" -i ~/.ssh/oci_key /tmp/waterverdict-seed-data.tgz "${OCI_USERNAME}@${OCI_HOST_CLEAN}:/tmp/waterverdict-seed-data.tgz"
          ssh -T -p "${OCI_PORT}" -i ~/.ssh/oci_key "${OCI_USERNAME}@${OCI_HOST_CLEAN}" <<'EOF'
          set -eu
          mkdir -p ~/deploy/waterverdict
          cd ~/deploy/waterverdict

          if [ -f docker-compose.yml ]; then
            docker compose down || true
          fi

          REMOTE_UID="$(id -u)"
          REMOTE_GID="$(id -g)"

          docker run --rm -v "$PWD:/target" alpine:3.22 sh -c "mkdir -p /target/data && chown -R ${REMOTE_UID}:${REMOTE_GID} /target/data && rm -rf /target/data/pseo /target/data/registry && mkdir -p /target/data/pseo /target/data/registry && chown -R ${REMOTE_UID}:${REMOTE_GID} /target/data"

          tar -xzf /tmp/waterverdict-seed-data.tgz -C "$PWD"
          rm -f /tmp/waterverdict-seed-data.tgz
          EOF

      - name: Deploy to OCI
        shell: bash
        env:
          OCI_USERNAME: ${{ secrets.OCI_USERNAME }}
          APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
          APP_TAP_SCORE_ESSENTIAL_URL: ${{ secrets.APP_TAP_SCORE_ESSENTIAL_URL }}
          APP_TAP_SCORE_ADVANCED_URL: ${{ secrets.APP_TAP_SCORE_ADVANCED_URL }}
          APP_OPENAI_DOMAIN_CHALLENGE_TOKEN: ${{ secrets.APP_OPENAI_DOMAIN_CHALLENGE_TOKEN }}
          APP_SUPPORT_EMAIL: ${{ secrets.APP_SUPPORT_EMAIL }}
        run: |
          {
            printf 'SPRING_PROFILES_ACTIVE=prod\n'
            printf 'APP_SITE_BASE_URL=https://waterverdict.com\n'
            printf 'APP_ADMIN_USERNAME=%s\n' "${APP_ADMIN_USERNAME}"
            printf 'APP_ADMIN_PASSWORD=%s\n' "${APP_ADMIN_PASSWORD}"
            printf 'APP_TAP_SCORE_ESSENTIAL_URL=%s\n' "${APP_TAP_SCORE_ESSENTIAL_URL}"
            printf 'APP_TAP_SCORE_ADVANCED_URL=%s\n' "${APP_TAP_SCORE_ADVANCED_URL}"
            printf 'APP_OPENAI_DOMAIN_CHALLENGE_TOKEN=%s\n' "${APP_OPENAI_DOMAIN_CHALLENGE_TOKEN}"
            printf 'APP_SUPPORT_EMAIL=%s\n' "${APP_SUPPORT_EMAIL:-support@waterverdict.com}"
          } > /tmp/waterverdict.env
          chmod 600 /tmp/waterverdict.env
          scp -P "${OCI_PORT}" -i ~/.ssh/oci_key /tmp/waterverdict.env "${OCI_USERNAME}@${OCI_HOST_CLEAN}:/tmp/waterverdict.env"
          rm -f /tmp/waterverdict.env

          ssh -T -p "${OCI_PORT}" -i ~/.ssh/oci_key "${OCI_USERNAME}@${OCI_HOST_CLEAN}" <<'EOF'
          set -eu
          mkdir -p ~/deploy/waterverdict/data
          cd ~/deploy/waterverdict

          mv /tmp/waterverdict.env .env
          chmod 600 .env

          cat > docker-compose.yml <<'COMPOSEEOF'
          services:
            app:
              image: shinhyeok22/waterverdict:latest
              container_name: waterverdict
              restart: unless-stopped
              ports:
                - "8809:8080"
              environment:
                SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
                APP_SITE_BASE_URL: ${APP_SITE_BASE_URL}
                APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME}
                APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
                APP_TAP_SCORE_ESSENTIAL_URL: ${APP_TAP_SCORE_ESSENTIAL_URL}
                APP_TAP_SCORE_ADVANCED_URL: ${APP_TAP_SCORE_ADVANCED_URL}
                APP_OPENAI_DOMAIN_CHALLENGE_TOKEN: ${APP_OPENAI_DOMAIN_CHALLENGE_TOKEN}
                APP_SUPPORT_EMAIL: ${APP_SUPPORT_EMAIL}
              volumes:
                - ./data:/app/data
              mem_limit: 512m
          COMPOSEEOF

          printf '%s' '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ secrets.DOCKERHUB_USERNAME }}' --password-stdin
          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f
          EOF

      - name: Verify deployed app
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error https://waterverdict.com/health/app | jq -e '.status == "ok"' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Production health check did not become ready."
          exit 1
