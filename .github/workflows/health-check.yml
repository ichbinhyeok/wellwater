name: Production Health Check

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify app health
        shell: bash
        run: |
          curl --fail --silent --show-error https://waterverdict.com/health/app \
            | jq -e '.status == "ok" and .surface == "private-well-test-finder"'

      - name: Verify MCP contract
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error https://waterverdict.com/mcp \
            --request POST \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')"
          printf '%s' "${response}" | jq -e '.result.tools | any(.name == "recommend_private_well_test_plan")'

      - name: Verify protected metric store
        shell: bash
        env:
          APP_ADMIN_USERNAME: ${{ secrets.APP_ADMIN_USERNAME }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
        run: |
          test -n "${APP_ADMIN_USERNAME}" && test -n "${APP_ADMIN_PASSWORD}"
          curl --fail --silent --show-error \
            --user "${APP_ADMIN_USERNAME}:${APP_ADMIN_PASSWORD}" \
            https://waterverdict.com/admin/pivot-metrics \
            | jq -e 'has("completions") and has("failures") and has("completionsByChannel")' >/dev/null
